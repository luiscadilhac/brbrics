services:
  - type: web
    name: brbrics-portal
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TRANSPARENCIA_TOKEN
        sync: false
      - key: BRAPI_TOKEN
        sync: false
      - key: SITE_URL
        value: https://brbrics.onrender.com
      - key: PAINEL_TOKEN
        generateValue: true
